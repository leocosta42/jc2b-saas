name: Backup diario do banco

on:
  schedule:
    - cron: '0 6 * * *'  # todo dia as 06:00 UTC (03:00 no horario de Brasilia)
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio da aplicacao
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar script de backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-db.mjs

      - name: Enviar backup para o repositorio privado
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: leocosta42/jc2b-saas-backups
        run: |
          DATA=$(date +%Y-%m-%d)
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" backup-repo
          mkdir -p "backup-repo/$DATA"
          cp -r "backups/$DATA/"* "backup-repo/$DATA/"
          cd backup-repo
          git config user.name "jc2b-backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add .
          git commit -m "backup $DATA" || echo "nada novo para commitar"
          git push
